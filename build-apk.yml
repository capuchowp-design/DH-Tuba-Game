name: Gerar APK

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "play = pacote AAB da Google Play | apkpure = APK com Pix (site/APKPure)"
        type: choice
        options: [apkpure, play]
        default: apkpure
      anuncios_teste:
        description: "Anúncios de TESTE do Google (desmarque só no build de produção da Play)"
        type: boolean
        default: true

env:
  # ID do APP no AdMob (DH Tuba Game).
  ADMOB_APP_ID: ca-app-pub-4518875317226768~4605342767

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CANAL: ${{ inputs.canal }}
      ADS_TESTE: ${{ inputs.anuncios_teste }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Conferir produção da Play
        if: ${{ inputs.canal == 'play' && inputs.anuncios_teste == false }}
        run: |
          if echo "$ADMOB_APP_ID" | grep -q "3940256099942544"; then echo "ERRO: troque ADMOB_APP_ID (neste arquivo) pelo ID real do AdMob antes do build de produção."; exit 1; fi
          if grep -q "3940256099942544" pro-config.js; then echo "ERRO: troque adRewardedId em pro-config.js pelo bloco premiado real do AdMob."; exit 1; fi

      - name: Instalar dependências
        run: npm install

      - name: Montar pasta www
        run: node scripts/prepare-www.js

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: AdMob e permissões
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" $M
          sed -i "s#</manifest>#    <uses-permission android:name=\"com.google.android.gms.permission.AD_ID\"/>\n    <uses-permission android:name=\"com.android.vending.BILLING\"/>\n</manifest>#" $M
          grep -n "APPLICATION_ID\|AD_ID\|BILLING" $M

      - name: Ícone do app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for pair in mdpi:96 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            cp icon-${s}x${s}.png $R/mipmap-$d/ic_launcher.png
            cp icon-${s}x${s}.png $R/mipmap-$d/ic_launcher_round.png
            cp icon-${s}x${s}.png $R/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Versão do app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      # ---------- APK (site / APKPure) ----------
      - name: Compilar APK
        if: ${{ inputs.canal != 'play' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar APK
        if: ${{ inputs.canal != 'play' }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            export KS_PASS KS_ALIAS
            $BT/apksigner sign --ks release.keystore --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --out dh-tuba-game.apk aligned.apk
            echo "APK assinado com a SUA chave."
          else
            keytool -genkeypair -keystore teste.keystore -alias teste -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=Teste"
            $BT/apksigner sign --ks teste.keystore --ks-key-alias teste \
              --ks-pass pass:android --key-pass pass:android \
              --out dh-tuba-game.apk aligned.apk
            echo "ATENÇÃO: APK assinado com chave de TESTE. Não publique este."
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.canal != 'play' }}
        with:
          name: dh-tuba-game-apk
          path: dh-tuba-game.apk

      # ---------- AAB (Google Play) ----------
      - name: Compilar AAB
        if: ${{ inputs.canal == 'play' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Assinar AAB
        if: ${{ inputs.canal == 'play' }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "ERRO: a Play exige o AAB assinado. Configure os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD e KEY_ALIAS."; exit 1; fi
          echo "$KS_B64" | base64 -d > release.keystore
          jarsigner -keystore release.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar dh-tuba-game.aab android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          jarsigner -verify dh-tuba-game.aab | head -3
          echo "AAB assinado com a SUA chave."

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.canal == 'play' }}
        with:
          name: dh-tuba-game-aab
          path: dh-tuba-game.aab
